workflows:
  ios-build:
    name: Build iOS Notificadores (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias Flutter
        script: |
          flutter packages pub get
      - name: Instalar pods de iOS
        script: |
          cd ios
          pod install
          cd ..
      - name: Compilar IPA sin firmar
        script: |
          flutter build ios --release --no-codesign
      - name: Empaquetar como archivo .ipa instalable
        script: |
          set -e
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No se encontró Runner.app"
            exit 1
          fi
          echo "Runner.app encontrado en: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Notificadores_unsigned.ipa Payload
          mkdir -p $CM_BUILD_DIR/output
          mv Notificadores_unsigned.ipa $CM_BUILD_DIR/output/
    artifacts:
      - output/Notificadores_unsigned.ipa